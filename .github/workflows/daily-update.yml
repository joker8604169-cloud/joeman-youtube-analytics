name: 每日更新頻道資料

on:
  schedule:
    # UTC 22:00 = 台灣時間隔日 06:00，早上開啟 Power BI 時已是最新
    - cron: "0 22 * * *"
  workflow_dispatch:        # 允許在 Actions 分頁手動觸發

permissions:
  contents: write           # 讓工作流程能把更新後的 CSV 推回儲存庫

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取 API 資料
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m src.fetch

      - name: 清洗與分類
        run: python -m src.transform

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/shorts_check_cache.json
          # 沒有變動時 commit 會失敗，故先檢查暫存區是否為空
          if git diff --staged --quiet; then
            echo "資料無變動，略過提交"
          else
            git commit -m "資料自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi

      - name: 顯示待檢視項目
        if: always()
        run: |
          if [ -f data/processed/review_queue.csv ]; then
            echo "=== 需人工檢視的項目 ==="
            cat data/processed/review_queue.csv
          fi
